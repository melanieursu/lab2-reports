# ================================================================
#  Конфигурация подключения к PostgreSQL для ЛР2
#  Файл: db.cfg
#
#  Приоритеты (от высшего к низшему):
#    1) Переменные окружения: DB_URL, DB_USER, DB_PASSWORD
#    2) Этот файл
# ================================================================

# JDBC URL: jdbc:postgresql://<хост>:<порт>/<база_данных>
db.url=jdbc:postgresql://localhost:5432/lab3db

# Пользователь PostgreSQL
db.user=postgres

# Пароль PostgreSQL
db.password=zxcdfg

# ----------------------------------------------------------------
#  Пример для переменных окружения (Linux/macOS):
#    export DB_URL=jdbc:postgresql://localhost:5432/lab2db
#    export DB_USER=postgres
#    export DB_PASSWORD=zxcdfg
#
#  Пример для переменных окружения (Windows CMD):
#    set DB_URL=jdbc:postgresql://localhost:5432/lab2db
#    set DB_USER=postgres
#    set DB_PASSWORD=zxcdfg
#
#  Запуск с PostgreSQL:
#    java -jar lab2-reports-3.0.jar --db
#  или просто (если db.cfg существует):
#    java -jar lab2-reports-3.0.jar
# ----------------------------------------------------------------
